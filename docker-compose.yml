version: "3.8"
services:
  backend:
    image: edenlee6473/ai-agent:BEv4  # Changed to v4
    env_file:
      - .env
    ports:
      - "8000:8000"
    shm_size: "1g"
    environment:
      - HEADLESS=1
    volumes:
      - ./screenshots:/app/screenshots

  frontend:
    image: edenlee6473/ai-agent:FEv4  # Changed to v4
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8000