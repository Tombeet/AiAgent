version: '3.8'

services:
  streamlit-agent:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MEDPLUM_USER=${MEDPLUM_USER}
      - MEDPLUM_PASS=${MEDPLUM_PASS}
    volumes:
      - ./screenshots:/app/screenshots
    restart: unless-stopped
